description: Savion Aerospace (FlySavion) is an aerospace company developing sustainable, zero-emissions
  aviation technology. Its flagship SavionJet is an autonomous blended-wing-body (ABWB) aircraft with a
  standup cabin and satellite-based piloting via proprietary autonomous flight software, and the company
  offers Zero-Emissions Flight Credits (ZFCs) as a subscription for organizations seeking carbon-free air
  travel beyond offsetting. Savion demonstrated a cryogenic LNG-fueled flight in 2019 and is a 500 Global
  (500 Startups) and Alchemist Accelerator portfolio company. The company operates as an aviation hardware
  and services business and publishes no public developer API, SDK, or documentation surface.
